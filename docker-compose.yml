version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bullsight-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bullsight-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/bullsight_db
      - JWT_SECRET=bullsight_super_secure_jwt_secret_key_2026
      - PYTHON_ML_SERVICE_URL=http://ml-engine:8000
      - NEWS_API_KEY=${NEWS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bullsight-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

  # Auxiliary Python ML Service (TensorFlow LSTM Neural Network)
  ml-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bullsight-ml-engine
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  mongodb_data:
